<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9F6F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Dhruv Saija" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- page-meta -->
    <title>MoodPixels — A little space for how you feel</title>
    <script>
      // Applies the stored colour-scheme preference before first paint, so a
      // visitor who pinned a theme never sees a flash of the other one.
      // Mirrors `apply()` in src/theme.ts — keep the two in step.
      try {
        var t = localStorage.getItem('moodpixels-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
